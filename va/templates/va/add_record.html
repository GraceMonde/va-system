{% extends "va/base.html" %}

{% block content %}

<h1>Add Verbal Autopsy Record</h1>

{% if form.errors %}
    <div class="alert alert-danger">
        Please correct the errors below.
    </div>
{% endif %}

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Save
    </button>

</form>

{% endblock %}
